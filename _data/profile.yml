short_bio: >-
  I'm a Master Student at LIESMARS, Wuhan University, under the supervision of Prof. <a href="https://dongzhenwhu.github.io/index.html">Zhen Dong</a> and 
  Prof. <a href="http://3s.whu.edu.cn/ybs/index.htm">Bisheng Yang</a>, closely working with Assistant Prof. <a href="https://liuyuan-pal.github.io">Yuan Liu</a> and 
  Research Assistant Prof. <a href="https://hpwang-whu.github.io">Haiping Wang</a> from HKUST. Before that, I received my B.S. degree from SGES of Sun Yat-sen University. My research focuses on 3D Agent Systems and Explorable World Models.

